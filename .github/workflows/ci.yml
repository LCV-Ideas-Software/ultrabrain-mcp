name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions: {}

concurrency:
  # Every successful main SHA is a release-controller input and must remain
  # observable. Pull requests still cancel superseded runs by PR number.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Install, check and smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Exercise the primary Windows host and the declared Node engines floor.
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          package-manager-cache: false

      - name: Verify npm registry
        shell: bash
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Biome (lint and format)
        run: npm run biome

      - name: Verify
        run: npm test
